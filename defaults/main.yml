---
# Project source code URL: https://github.com/firsttris/haben

haben_enabled: true

haben_identifier: haben
haben_base_path: "/{{ haben_identifier }}"
haben_data_path: "{{ haben_base_path }}/data"
haben_documents_path: "{{ haben_data_path }}/belege"
haben_eric_path: "{{ haben_data_path }}/eric"
haben_eric_log_path: "{{ haben_data_path }}/eric-log"

# renovate: datasource=docker depName=tristanteu/haben versioning=semver
haben_version: 0.14.0

haben_uid: ""
haben_gid: ""

# The scheme used for serving Haben.
haben_scheme: https

# The hostname at which Haben is served.
# Passkeys are bound to it, so it should not be changed later.
haben_hostname: ""

haben_base_url: "{{ haben_scheme }}://{{ haben_hostname }}"

haben_container_image: "{{ haben_container_image_registry_prefix }}tristanteu/haben:{{ haben_container_image_tag }}"
haben_container_image_tag: "{{ haben_version }}"
haben_container_image_registry_prefix: "{{ haben_container_image_registry_prefix_upstream }}"
haben_container_image_registry_prefix_upstream: "{{ haben_container_image_registry_prefix_upstream_default }}"
haben_container_image_registry_prefix_upstream_default: docker.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
haben_container_network: "{{ haben_identifier }}"

# Control if the container network is deleted on uninstalling.
haben_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `haben_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:3000"), or empty string to not expose.
haben_container_http_host_bind_port: ""

# The port number in the container
haben_container_http_port: 3000

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
haben_container_additional_networks: "{{ haben_container_additional_networks_auto + haben_container_additional_networks_custom }}"
haben_container_additional_networks_auto: []
haben_container_additional_networks_custom: []

# haben_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `haben_container_labels_additional_labels_custom`.
haben_container_labels_traefik_enabled: true
haben_container_labels_traefik_docker_network: "{{ haben_container_network }}"
haben_container_labels_traefik_hostname: "{{ haben_hostname }}"
haben_container_labels_traefik_rule: "Host(`{{ haben_container_labels_traefik_hostname }}`)"
haben_container_labels_traefik_priority: 0
haben_container_labels_traefik_entrypoints: web-secure
haben_container_labels_traefik_tls: "{{ haben_container_labels_traefik_entrypoints != 'web' }}"
haben_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls whether a compression middleware is attached to the router.
haben_container_labels_traefik_compression_middleware_enabled: false
haben_container_labels_traefik_compression_middleware_name: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `haben_container_labels_traefik_additional_request_headers_custom`
haben_container_labels_traefik_additional_request_headers: "{{ haben_container_labels_traefik_additional_request_headers_auto | combine(haben_container_labels_traefik_additional_request_headers_custom) }}"
haben_container_labels_traefik_additional_request_headers_auto: {}
haben_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `haben_container_labels_traefik_additional_response_headers_custom`
haben_container_labels_traefik_additional_response_headers: "{{ haben_container_labels_traefik_additional_response_headers_auto | combine(haben_container_labels_traefik_additional_response_headers_custom) }}"
haben_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-Content-Type-Options': haben_http_header_content_type_options} if haben_http_header_content_type_options else {})
    | combine ({'X-Frame-Options': haben_http_header_frame_options} if haben_http_header_frame_options else {})
    | combine ({'Referrer-Policy': haben_http_header_referrer_policy} if haben_http_header_referrer_policy else {})
    | combine ({'Strict-Transport-Security': haben_http_header_strict_transport_security} if haben_http_header_strict_transport_security and haben_container_labels_traefik_tls else {})
  }}
haben_container_labels_traefik_additional_response_headers_custom: {}

# haben_container_labels_tsdproxy_enabled controls whether labels for TSDProxy will be attached to the container.
# Haben accepts a single address only, so `haben_hostname` needs to be the tailnet address (`<name>.<tailnet>.ts.net`).
# See: https://almeidapaulopt.github.io/tsdproxy/docs/providers/docker/
haben_container_labels_tsdproxy_enabled: false
haben_container_labels_tsdproxy_name: "{{ haben_hostname.split('.') | first }}"
haben_container_labels_tsdproxy_ephemeral: false
haben_container_labels_tsdproxy_funnel: false
haben_container_labels_tsdproxy_dash_visible: true
haben_container_labels_tsdproxy_dash_label: Haben

# haben_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `haben_container_labels_additional_labels_custom`
#
# Example:
# haben_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
haben_container_labels_additional_labels: "{{ haben_container_labels_additional_labels_auto + haben_container_labels_additional_labels_custom }}"
haben_container_labels_additional_labels_auto: []
haben_container_labels_additional_labels_custom: []

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
haben_http_header_content_type_options: nosniff

# Specifies the value of the `X-Frame-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options
haben_http_header_frame_options: SAMEORIGIN

# Specifies the value of the `Referrer-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy
haben_http_header_referrer_policy: same-origin

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
haben_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if haben_hsts_preload_enabled else '' }}"

# Controls if HSTS preloading is enabled
# See: `haben_http_header_strict_transport_security`
haben_hsts_preload_enabled: false

# Specifies how often the container health-check will run.
#
# For Traefik based setups, it's important that the interval is short,
# because the interval value also specifies the "initial wait time".
# This is a Docker (moby) bug: https://github.com/moby/moby/issues/33410
# Without a successful healthcheck, Traefik will not register the service for reverse-proxying.
# Thus, the health interval determines the initial start-up time -- the smaller, the better.
#
# For non-Traefik setups, we use the default healthcheck interval (30s) to decrease overhead.
haben_container_health_interval: "{{ '5s' if haben_container_labels_traefik_enabled else '30s' }}"

# Specify the size of the container's /tmp tmpfs volume.
# Haben uses it for processing uploaded PDFs and rendering documents.
haben_container_tmpfs_tmp_size: 512m

# A list of extra arguments to pass to the container (`docker create` command)
haben_container_extra_arguments: "{{ haben_container_extra_arguments_auto + haben_container_extra_arguments_custom }}"
haben_container_extra_arguments_auto: []
haben_container_extra_arguments_custom: []

# List of systemd services that the Haben systemd service depends on.
haben_systemd_required_services_list: "{{ haben_systemd_required_services_list_default + haben_systemd_required_services_list_auto + haben_systemd_required_services_list_custom }}"
haben_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
haben_systemd_required_services_list_auto: []
haben_systemd_required_services_list_custom: []

# List of systemd services that the Haben systemd service wants
haben_systemd_wanted_services_list: "{{ haben_systemd_wanted_services_list_default + haben_systemd_wanted_services_list_auto + haben_systemd_wanted_services_list_custom }}"
haben_systemd_wanted_services_list_default: []
haben_systemd_wanted_services_list_auto: []
haben_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
haben_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
haben_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
haben_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
haben_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ haben_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ haben_container_stop_grace_time_seconds }} {{ haben_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ haben_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ haben_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ haben_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ haben_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ haben_identifier }} after {{ haben_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

########################################################################
#                                                                      #
# database                                                             #
#                                                                      #
########################################################################

# Haben requires a Postgres database.
haben_database_hostname: ""
haben_database_port: 5432
haben_database_name: haben

# The owner of the database. It runs the migrations on startup.
haben_database_username: haben
haben_database_password: ""

# Optional restricted role used by the running application.
# If set, the owner above is only used for migrations (`MIGRATION_DATABASE_URL`).
# The role is not created by this role.
haben_database_app_username: ""
haben_database_app_password: ""

haben_database_owner_url: "postgres://{{ haben_database_username | urlencode | replace('/', '%2F') }}:{{ haben_database_password | urlencode | replace('/', '%2F') }}@{{ haben_database_hostname }}:{{ haben_database_port }}/{{ haben_database_name }}"
haben_database_app_url: "postgres://{{ haben_database_app_username | urlencode | replace('/', '%2F') }}:{{ haben_database_app_password | urlencode | replace('/', '%2F') }}@{{ haben_database_hostname }}:{{ haben_database_port }}/{{ haben_database_name }}"

haben_database_url: "{{ haben_database_app_url if haben_database_app_username else haben_database_owner_url }}"
haben_database_migration_url: "{{ haben_database_owner_url if haben_database_app_username else '' }}"

########################################################################
#                                                                      #
# /database                                                            #
#                                                                      #
########################################################################

########################################################################
#                                                                      #
# environment variables                                                #
#                                                                      #
########################################################################

# Signs the sessions. Must be at least 32 characters long.
haben_environment_variables_better_auth_secret: ""

# Encrypts the ELSTER certificate and stored API keys. Exactly 32 bytes, base64-encoded.
# Generate it with `openssl rand -base64 32` and keep a copy in a safe place.
# Do not change it later, or the encrypted data becomes unreadable.
haben_environment_variables_haben_encryption_key: ""

# Fixed code for the initial account setup (at least 8 characters).
# If empty, Haben generates one on every start and prints it to the log, until an account exists.
haben_environment_variables_haben_setup_code: ""

# Controls whether login is exclusively via OpenID Connect, with roles taken from groups.
haben_environment_variables_oidc_only: false
haben_environment_variables_oidc_issuer: ""
haben_environment_variables_oidc_client_id: ""
haben_environment_variables_oidc_client_secret: ""
haben_environment_variables_oidc_scopes: ""
haben_environment_variables_oidc_display_name: ""
haben_environment_variables_oidc_groups_claim: groups
haben_environment_variables_oidc_group_inhaber: ""
haben_environment_variables_oidc_group_steuerberatung: ""

# Controls whether ERiC is downloaded from download.elster.de on startup if it is missing.
# Enabling it means accepting ERiC's terms of use.
haben_environment_variables_eric_auto_install_enabled: false

# Your own manufacturer ID (Hersteller-ID) for ELSTER, exactly five digits
haben_environment_variables_elster_hersteller_id: ""

# Specify the timezone
haben_environment_variables_tz: Europe/Berlin

# Additional environment variables.
# See: https://haben.app/installation-konfiguration.html#umgebungsvariablen
haben_environment_variables_additional_variables: ""

########################################################################
#                                                                      #
# /environment variables                                               #
#                                                                      #
########################################################################

# haben_restart_necessary controls whether the Haben systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
haben_restart_necessary: false
